<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pages.kanolog.net</title>
<style>
  :root {
    --bg: #fafaf8;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2563eb;
    --card: #ffffff;
    --border: #e5e5e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --fg: #e8e8e6;
      --muted: #9a9a97;
      --accent: #7aa2f7;
      --card: #1f1f24;
      --border: #2e2e34;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    padding: 3rem 1.5rem;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.02em; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; margin-bottom: 2.5rem; }
  ul { list-style: none; }
  li { margin-bottom: 1rem; }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.3rem;
    text-decoration: none;
    color: var(--fg);
    transition: border-color 0.15s;
  }
  a.card:hover { border-color: var(--accent); }
  a.card .title { font-weight: 600; color: var(--accent); }
  a.card .desc { font-size: 0.88rem; color: var(--muted); margin-top: 0.2rem; }
  footer { margin-top: 3rem; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>pages.kanolog.net</h1>
  <p class="sub">公開ドキュメント置き場</p>
  <ul>
    <li>
      <a class="card" href="/launchbook/">
        <div class="title">AI Agent Full-Stack Launchbook</div>
        <div class="desc">AIエージェントによるフルスタック開発ハンズオン</div>
      </a>
    </li>
  </ul>
  <footer>kanolog.net</footer>
</main>
</body>
</html>
